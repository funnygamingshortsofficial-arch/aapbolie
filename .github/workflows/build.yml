name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AapBolie-Part1-Source-Code.zip'
      - 'AapBolie-Part2-GitHub-Setup.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check ZIP files
        run: |
          test -f AapBolie-Part1-Source-Code.zip
          test -f AapBolie-Part2-GitHub-Setup.zip

      - name: Extract both ZIP files
        run: |
          unzip -oq AapBolie-Part1-Source-Code.zip
          unzip -oq AapBolie-Part2-GitHub-Setup.zip

      - name: Configure Android project
        run: |
          printf 'android.useAndroidX=true\nandroid.nonTransitiveRClass=true\norg.gradle.jvmargs=-Xmx3g\n' > AapBolie/gradle.properties

      - name: Build APK
        working-directory: AapBolie
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AapBolie-APK
          path: AapBolie/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
